<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di Sebalik Fitnah</title>
    <style>
        /* DESIGN BARU: SINEMATIK & EMOSIONAL */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #output {
            max-width: 900px;
            width: 90%;
            padding: 30px 0;
            background-color: transparent;
            border: none;
            box-shadow: none;
            text-align: center;
        }
        .text-line {
            opacity: 0;
            margin: 25px 0;
            font-size: 1.5em; /* Desktop Default */
            line-height: 1.5;
            transition: opacity 1.5s ease-in-out;
        }
        .center-text {
            text-align: center;
        }

        /* Warna untuk kesan dramatik - Saiz DESKTOP */
        .color-title { color: #FFD700; font-size: 2.5em; font-weight: bold; }
        .color-main-msg { color: #E6E6FA; font-size: 1.9em; font-style: italic; } /* Saiz h3 di desktop */
        .color-focus { color: #FA8072; font-weight: bold; }
        .color-support { color: #90EE90; font-size: 1.2em; }

        /* Gaya Kotak Mesej Akhir */
        .final-result-box {
            background-color: #1c1c1c;
            padding: 30px;
            margin-top: 50px;
            border-radius: 5px;
            border-left: 5px solid #FFD700;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .final-result-box h3 {
            /* H3 menggunakan class color-main-msg untuk saiz desktop */
            line-height: 1.4;
            margin-bottom: 30px;
        }
        
        .image-container {
            opacity: 0;
            margin: 20px auto;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            transform: scale(0.8);
        }
        .image-container.show {
            opacity: 1;
            transform: scale(1);
        }
        .proof-image {
            max-width: 90%;
            height: auto;
            border: 5px solid #E6E6FA;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* ========================================================= */
        /* MEDIA QUERIES: MEMBETULKAN SAIZ TULISAN PADA SKRIN HP */
        /* ========================================================= */
        @media (max-width: 600px) {
            /* Saiz Teks Asas (text-line) */
            .text-line {
                font-size: 1.2em;
                margin: 15px 0;
            }
            
            /* Tajuk Utama (H3 / color-main-msg) */
            .color-main-msg { 
                font-size: 1.4em; /* Dikurangkan saiz untuk HP */
            }

            /* Sub-Tajuk / Judul (color-title) */
            .color-title { 
                font-size: 1.8em; /* Dikurangkan saiz untuk HP */
            }

            /* Ayat Sokongan (color-support) */
            .color-support { 
                font-size: 1.0em; 
            }
            
            /* Saiz Gambar Penuh */
            .proof-image {
                max-width: 100%; /* Lebih besar sedikit di HP */
            }
        }
    </style>
</head>
<body>

    <div id="output"></div>

    <script>
        const outputDiv = document.getElementById('output');
        const lineDelay = 1500;
        
        async function writeLine(text, colorClass = "color-white", delay = lineDelay) {
            const lineElement = document.createElement('div');
            lineElement.className = 'text-line ' + colorClass;
            lineElement.innerHTML = text;
            outputDiv.appendChild(lineElement);
            outputDiv.scrollTop = outputDiv.scrollHeight;

            void lineElement.offsetWidth;
            lineElement.style.opacity = 1;
            
            await new Promise(resolve => setTimeout(resolve, delay));
        }

        const photoPath = '';
        const photos = ['Cap1.jpg'];

        async function showImageDramatically(photo) {
            const imgContainer = document.createElement('div');
            imgContainer.className = 'image-container';
            imgContainer.innerHTML = `<img src="${photoPath}${photo}" alt="Kenangan Keluarga" class="proof-image">`;
            outputDiv.appendChild(imgContainer);
            outputDiv.scrollTop = outputDiv.scrollHeight;

            await new Promise(resolve => setTimeout(resolve, 50));

            imgContainer.classList.add('show'); 
            await new Promise(resolve => setTimeout(resolve, 1500));
        }

        async function runPresentation() {
            outputDiv.innerHTML = ""; 

            await writeLine("MEMPERSEMBAHKAN...", "color-support", 1000); 
            await writeLine("Di Sebalik Fitnah", "color-title", 1500); 
            
            
            // Kotak Mesej Akhir & Paparan Gambar
            outputDiv.innerHTML += `
                <div class="final-result-box text-line">
                    <h3 class="color-main-msg">
                       "Walau kami di kata belakang, di fitnah oleh <span class="color-focus">si Batu Api</span>, <br>Kami tetap bersama.<br>Kerana kami sudah biasa mandi sungai bersama sebelum semua ini."
                    </h3>
                    <p class="color-support">Di sini kami bertapak. Sunyi tak memadam, jauh tak melupai.</p>
                    
            `;
            const finalBox = outputDiv.lastElementChild;
            void finalBox.offsetWidth; 
            finalBox.style.opacity = 1;

            await new Promise(resolve => setTimeout(resolve, 2000));

            for(const photo of photos) {
                await showImageDramatically(photo);
            }

            outputDiv.innerHTML += `
                <p class="text-line color-title">💖 IKATAN KELUARGA TIADA GANTI 💖</p>
                </div>
            `;
            const closing = outputDiv.lastElementChild;
            void closing.offsetWidth;
            closing.style.opacity = 1;

            outputDiv.scrollTop = outputDiv.scrollHeight;
            await new Promise(resolve => setTimeout(resolve, 3000));
        }

        runPresentation();
    </script>

</body>
</html>
