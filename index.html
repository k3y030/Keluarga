<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di Sebalik Fitnah</title>
    <style>
        /* DESIGN BARU: SINEMATIK & EMOSIONAL */
        body {
            background-color: #000000; /* Hitam Penuh */
            color: #FFFFFF;
            font-family: 'Georgia', 'Times New Roman', serif; /* Font lebih klasik/emosional */
            padding: 0;
            margin: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #output {
            max-width: 900px; 
            width: 90%;
            padding: 30px 0;
            background-color: transparent; 
            border: none;
            box-shadow: none;
            text-align: center;
        }
        .text-line {
            opacity: 0; /* Semua baris bermula tersembunyi */
            margin: 25px 0;
            font-size: 1.5em; /* Saiz besar untuk impak */
            line-height: 1.5;
            transition: opacity 1.5s ease-in-out; /* Animasi pudar masuk yang dramatik */
        }
        .center-text {
            text-align: center;
        }

        /* Warna untuk kesan dramatik */
        .color-title { color: #FFD700; font-size: 2.5em; font-weight: bold; } /* Emas */
        .color-main-msg { color: #E6E6FA; font-size: 1.8em; font-style: italic; } /* Lavender */
        .color-focus { color: #FA8072; font-weight: bold; } /* Salmon (Fokus) */
        .color-support { color: #90EE90; font-size: 1.2em; } /* Hijau Lembut */

        /* Gaya Kotak Mesej Akhir (Diringkaskan) */
        .final-result-box {
            background-color: #1c1c1c; /* Latar belakang kelabu gelap */
            padding: 30px;
            margin-top: 50px;
            border-radius: 5px;
            border-left: 5px solid #FFD700; /* Garisan Emas di tepi */
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .final-result-box h3 {
            color: #FFFFFF;
            font-size: 1.9em;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        .proof-image {
            max-width: 90%;
            height: auto;
            border: 5px solid #E6E6FA; /* Border putih/lavender */
            margin: 20px auto;
            display: block;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="output"></div>

    <script>
        const outputDiv = document.getElementById('output');
        const lineDelay = 1500; // Delay yang lebih panjang untuk kesan sinematik
        
        // Fungsi baru untuk pudar masuk (fade in)
        async function writeLine(text, colorClass = "color-white", delay = lineDelay) {
            const lineElement = document.createElement('div');
            lineElement.className = 'text-line ' + colorClass;
            lineElement.innerHTML = text;
            outputDiv.appendChild(lineElement);
            outputDiv.scrollTop = outputDiv.scrollHeight;

            // Paksa reflow sebelum set opacity (memastikan transisi berlaku)
            void lineElement.offsetWidth;
            lineElement.style.opacity = 1;
            
            await new Promise(resolve => setTimeout(resolve, delay));
        }

        const photoPath = '';
        // DIKEMASKINI: Menggunakan 'Capture1.jpeg' untuk semua 3 paparan
        const photos = ['Cap1.jpg']; 

        async function runPresentation() {
            outputDiv.innerHTML = ""; 

            // Bahagian 1: Pengenalan Ringkas
            await writeLine("MEMPERSEMBAHKAN...", "color-support", 1000); 
            await writeLine("Di Sebalik Fitnah", "color-title", 1500);
            
            
            // === MESEJ UTAMA & GAMBAR ===
            
            // Kotak Mesej Akhir & Paparan Gambar
            outputDiv.innerHTML += `
                <div class="final-result-box text-line">
                    <h3 class="color-main-msg">
                        "Walau kami di kata belakang, di fitnah oleh <span class="color-focus">si Batu Api</span>, <br>Kami tetap bersama.<br>Kerana kami sudah biasa mandi sungai bersama sebelum semua ini."
                    </h3>
                    <p class="color-support">Di sini kami bertapak. Sunyi tak memadam, jauh tak melupai.</p>
            `;
            const finalBox = outputDiv.lastElementChild;
            void finalBox.offsetWidth; // Paksa reflow
            finalBox.style.opacity = 1;

            await new Promise(resolve => setTimeout(resolve, 2000));

            // Papar Gambar satu persatu
            for(const photo of photos) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'text-line';
                imgContainer.innerHTML = `<img src="${photoPath}${photo}" alt="Kenangan Keluarga" class="proof-image">`; 
                outputDiv.appendChild(imgContainer);
                void imgContainer.offsetWidth;
                imgContainer.style.opacity = 1;
                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            outputDiv.innerHTML += `
                <p class="text-line color-title">💖 IKATAN KELUARGA TIADA GANTI 💖</p>
                </div>
            `;
            const closing = outputDiv.lastElementChild;
            void closing.offsetWidth;
            closing.style.opacity = 1;

            outputDiv.scrollTop = outputDiv.scrollHeight;
            await new Promise(resolve => setTimeout(resolve, 3000));
        }

        runPresentation();
    </script>

</body>
</html>
